<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="login.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Login</title>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-gray-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">

            <div class="flex items-center gap-3">

                <div class="w-10 h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold">
                    P
                </div>

                <h1 class="text-xl font-bold text-gray-800">
                    Painel
                </h1>

            </div>

            <span class="text-sm text-gray-500 hidden sm:block">
                Sistema de Gestão
            </span>

        </div>
    </header>


    <!-- Conteúdo principal -->
    <main class="flex-1 flex items-center justify-center px-4 pt-24 pb-12">

        <form class="bg-white border-2 border-gray-200 w-full max-w-md p-8 rounded-2xl shadow-xl">

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
                Login
            </h1>

            <!-- Usuário -->
            <div class="mb-5">
                <label class="block text-gray-700 font-semibold mb-2">
                    Usuário
                </label>

                <input
                    type="text"
                    placeholder="Digite seu usuário"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500"
                >
            </div>


            <!-- Senha -->
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">
                    Senha
                </label>

                <input
                    type="password"
                    placeholder="Digite sua senha"
                    required
                    class="w-full border border-gray-400 rounded-lg px-4 py-3
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500"
                >
            </div>


            <!-- Botões -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                <button
                    type="submit"
                    class="bg-blue-600 text-white py-3 rounded-lg
                           font-semibold hover:bg-blue-700 transition">
                    Entrar
                </button>

                <button
                    type="reset"
                    class="bg-gray-200 text-gray-700 py-3 rounded-lg
                           font-semibold hover:bg-gray-300 transition">
                    Limpar
                </button>

            </div>

        </form>

    </main>


    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200">
        <div class="max-w-7xl mx-auto px-6 py-5 text-center text-sm text-gray-500">
            © 2026 Painel — Todos os direitos reservados.
        </div>
    </footer>

</body>
</html>
